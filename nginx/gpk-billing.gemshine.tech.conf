# ==============================================================================
# Nginx Configuration for GPK Billing
# Domain: gpk-billing.gemshine.tech
# Backend Port: 5032
# Frontend Web Root: /var/www/gpk-billing/dist
#
# Production Setup:
# 1. Copy or link this file:
#    sudo cp nginx/gpk-billing.gemshine.tech.conf /etc/nginx/sites-available/gpk-billing.gemshine.tech
#    sudo ln -s /etc/nginx/sites-available/gpk-billing.gemshine.tech /etc/nginx/sites-enabled/
# 2. Test configuration:
#    sudo nginx -t
# 3. Reload Nginx:
#    sudo systemctl reload nginx
# 4. Generate SSL with Certbot:
#    sudo certbot --nginx -d gpk-billing.gemshine.tech
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name gpk-billing.gemshine.tech;

    # Root directory for frontend Vite React production build
    root /var/www/gpk-billing/dist;
    index index.html;

    # Maximum file upload size (for PDF bills and image uploads)
    client_max_body_size 50M;

    # Gzip compression for faster page load
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Frontend Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching (Vite hashed bundles)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Backend API Reverse Proxy (Express server running on port 5032)
    location /api/ {
        proxy_pass http://127.0.0.1:5032/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for longer requests / uploads
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
